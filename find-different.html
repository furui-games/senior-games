<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=_NeK7dBS3-J_PFymw1Is0kcLeVlFv9HF3mBND3PAqADj5GHzSF0D2EvBJHK07kXY3S-w9JTyJgEtE6B8nWbv5eHJe4jAGNAxCgZ9NLsNuygQmNjLYyDupAQdEZ5ZzYbq4BwFXy6WEuJTYUCc6afoPHpJgIjZuV8NafQx2CijHRCP0rvGtHUrc9pXTPlKJO_vs9R0a-BTWujOnMUq6g1xWYL7xpfiP2xPbUf-YyGOtbQfv5QFzXdXWfSR1xOgVmYZf-s-xpXp7tYjKCjo9UGb8E8jNm8XsK_AMpeTESwaKzumHxcnmMgBKK6PgQtLNzkhIG7HI_GcwIQIU2_gRmHxVw" charset="UTF-8"></script><link rel="stylesheet" crossorigin="anonymous" href="https://gc.kis.v2.scr.kaspersky-labs.com/E3E8934C-235A-4B0E-825A-35A08381A191/abn/main.css?attr=aHR0cHM6Ly9jaGF0Z3B0LmNvbS9iYWNrZW5kLWFwaS9lc3R1YXJ5L2NvbnRlbnQ_aWQ9ZmlsZV8wMDAwMDAwMDM2NTg4MWZkOTBmOTRlYTJlMDliMGIzYSZmbj1mdXJ1aV9maW5kX2RpZmZlcmVudF92MTIuaHRtbCZjZD1hdHRhY2htZW50JnRzPTQ5NjgxNyZwPWZzJmNpZD0xJnNpZz0yMGI1NzMyNmYyMmJhMGVkNGFiMjQzZWUzNDE0ZDA3N2MyODI0ZTMwOTFmYjFjNzIwZGIzMzY4ZDhlNGYzNzQ0JnY9MA"/><style>
body{
  font-family:Arial,"Noto Sans TC",sans-serif;
  background:#fffaf0;
  margin:0;
  padding:10px;
  color:#4b3a2b
}
.game{max-width:560px;margin:auto}
h1{text-align:center;margin:4px;color:#5f402d}
.sub{text-align:center;font-size:13px;margin-bottom:8px}

input,button{
  font-size:17px;
  border-radius:9px;
  border:2px solid #d8c5a1;
  padding:8px
}
input{
  width:100%;
  box-sizing:border-box;
  margin-bottom:6px
}

.stats{
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr;
  gap:5px
}
.stat{
  text-align:center;
  background:#fffdf7;
  border:2px solid #ead8b8;
  border-radius:10px;
  padding:5px
}
.stat span{display:block;font-size:12px}
.stat strong{font-size:28px}
.score strong{font-size:42px;color:#9b641b}

.row{
  display:flex;
  gap:5px;
  margin:6px 0;
  flex-wrap:wrap
}
.row button{
  flex:1;
  min-width:70px;
  background:#fffdf7;
  font-weight:bold
}
button.active{
  background:#ffe6a0;
  border-color:#d7a630
}
.topicRow button{font-size:15px;padding:7px 5px}
#start{
  background:#4f8a5b;
  color:#fff;
  border:0
}

#status{display:none}
.hint{
  text-align:center;
  font-size:13px;
  color:#786a5f;
  margin-bottom:8px
}

.label{
  text-align:center;
  font-size:20px;
  font-weight:900;
  margin:7px 0 4px
}

.grid{
  display:grid;
  gap:7px;
  padding:9px;
  border:3px solid #d7b97c;
  border-radius:15px;
  background:#fff6dc
}

.cell{
  aspect-ratio:1;
  border-radius:12px;
  border:2px solid #d8c5a1;
  background:#fffdf7;
  font-size:clamp(3rem,15vw,5.5rem);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  min-width:0
}
.cell:active{transform:scale(.96)}
.cell.correct{
  border:4px solid #e24432;
  background:#fff3de
}

#time.urgent{
  color:#d72e10;
  display:inline-block;
  animation:beat .35s infinite alternate
}
@keyframes beat{to{transform:scale(1.18)}}

.rank{
  margin-top:10px;
  background:#fffdf7;
  border:2px solid #e0c894;
  border-radius:10px;
  padding:8px
}
table{
  width:100%;
  border-collapse:collapse;
  text-align:center;
  font-size:13px
}
th,td{
  padding:5px;
  border-bottom:1px solid #eee0c8
}
#clearScores{
  display:block;
  margin:8px auto 0;
  padding:7px 14px;
  background:#fff5f2;
  color:#8c4037;
  border:1px solid #cba99f
}

.gridWrap{position:relative}

.gridWrap.urgent .grid{
  border-color:#ef4b16;
  box-shadow:0 0 20px rgba(255,70,20,.75);
  animation:redAlert .4s infinite alternate}
@keyframes redAlert{
  to{
    border-color:#d92f12;
    box-shadow:0 0 28px rgba(255,55,10,.9)}
}

#confetti{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:999
}
.confettiPiece{
  position:absolute;
  bottom:-26px;
  width:10px;
  height:18px;
  border-radius:2px;
  opacity:0;
  animation:confettiUp 2.5s ease-out forwards
}
@keyframes confettiUp{
  0%{transform:translate(0,0) rotate(0deg) scale(.8);opacity:0}
  12%{opacity:1}
  68%{transform:translate(var(--x),var(--y)) rotate(560deg) scale(1);opacity:1}
  100%{transform:translate(calc(var(--x)*1.18),calc(var(--y)*.78)) rotate(900deg) scale(.92);opacity:0}
}

body.playing .gridWrap{
  width:min(100%,620px);
  margin-left:auto;
  margin-right:auto}
body.playing #status{
  text-align:center}

.grid[data-size="5"] .cell{
  font-size:clamp(2.1rem,9vw,3.8rem)}


body.playing #name,
body.playing .row,
body.playing .topicRow,
body.playing .sub{
  display:none;
}
body.playing h1{
  margin-bottom:8px;
}
body.playing .stats{
  margin-bottom:8px;
}


#finishOverlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(63,50,39,.48);align-items:center;justify-content:center;padding:18px;box-sizing:border-box}
#finishOverlay.show{display:flex}
.finishCard{width:min(92vw,520px);background:#fffdf9;border:3px solid #ddcdbb;border-radius:28px;padding:28px 24px 24px;box-sizing:border-box;text-align:center;box-shadow:0 12px 35px rgba(60,40,20,.22)}
.finishTitle{font-size:clamp(30px,8vw,46px);font-weight:900;color:#b85f24;margin:0 0 18px}
.finishScore{font-size:clamp(48px,14vw,72px);line-height:1;font-weight:900;color:#d87527;margin:4px 0 24px}
.finishInfo{font-size:clamp(20px,5.5vw,28px);line-height:1.75;font-weight:900;color:#40382f}
.finishActions{display:grid;gap:12px;margin-top:26px}
.finishActions button{min-height:68px;border:0;border-radius:22px;font-size:clamp(21px,5.5vw,28px);font-weight:900}
#playAgain{background:#f39142;color:white;box-shadow:0 8px 0 #c96720}
#backSettings{background:#f2eadf;color:#645548}


/* 樂齡版：遊戲進行時固定畫面，不允許頁面滑動 */
body.playing{
  overflow:hidden;
  overscroll-behavior:none;
}
body.playing h1{
  display:none;
}

/* 排行榜：開始前顯示、遊戲中隱藏、結束後與回設定後顯示 */
.rank{
  display:block !important;
}
body.playing .rank{
  display:none !important;
}

</style>
</head>
<body>
<div class="game">
<h1>福睿找找不一樣</h1>
<div class="sub">樂齡觀察力 × 專注力挑戰</div>
<input id="name" placeholder="請輸入參賽者姓名">
<div class="stats">
<div class="stat score">
<span>分數</span>
<strong id="score">0</strong>
</div>
<div class="stat">
<span>時間</span>
<strong id="time">60</strong>
</div>
<div class="stat">
<span>答對</span>
<strong id="correct">0</strong>
</div>
</div>
<div class="row topicRow">
<button class="topic active" data-topic="transport">🚗 交通</button>
<button class="topic" data-topic="color">🎨 顏色</button>
<button class="topic" data-topic="fruit">🍎 水果</button>
<button class="topic" data-topic="animal">🐶 動物</button>
<button class="topic" data-topic="insect">🐝 昆蟲</button>
</div>
<div class="row">
<button class="level active" data-level="easy">易</button>
<button class="level" data-level="medium">中</button>
<button class="level" data-level="hard">難</button>
<button class="level" data-level="ultimate">終級</button>
<button id="sound">🔊</button>
</div>
<div class="row">
<button id="start">開始</button>
</div>
<div id="status">請輸入姓名後開始</div>
<div class="hint" style="display:none">每題只有 1 格不一樣，找到後會自動換下一題。</div>
<div id="gridWrap" class="gridWrap">
<div id="confetti"></div>
<div id="bottomGrid" class="grid"></div>
</div>
<div class="rank">
<b>🏆 成績排行榜</b>
<table>
<thead>
<tr><th>姓名</th><th>主題</th><th>難度</th><th>分數</th><th>答對</th></tr>
</thead>
<tbody id="rank"></tbody>
</table>
<button id="clearScores">清除紀錄</button>
</div>
</div>

<div id="finishOverlay" aria-hidden="true">
  <div class="finishCard" role="dialog" aria-modal="true" aria-label="挑戰完成">
    <div class="finishTitle">🎉 挑戰完成！</div>
    <div class="finishScore"><span id="finishScore">0</span> 分</div>
    <div class="finishInfo">
      <div>成功答對：<span id="finishCorrect">0</span> 題</div>
      <div>主題：<span id="finishTopic">—</span>　難度：<span id="finishLevel">—</span></div>
    </div>
    <div class="finishActions">
      <button id="playAgain">再玩一次</button>
      <button id="backSettings">回設定</button>
    </div>
  </div>
</div>

<script>
const cfg={
  easy:{size:2,label:"易"},
  medium:{size:3,label:"中"},
  hard:{size:4,label:"難"},
  ultimate:{size:5,label:"終級"}
};

const topics={
  transport:{
    label:"交通",
    pairs:[
      ["🚗","🚌"],["🚲","🛵"],["✈️","🚁"],["🚢","⛵"],
      ["🚕","🚓"],["🚚","🚜"],["🚆","🚇"],["🛶","🚤"]
    ]
  },
  color:{
    label:"顏色",
    pairs:[
      ["🔴","🟢"],["🟡","🔵"],["🟣","🟠"],["🟥","🟦"],
      ["🟩","🟨"],["🟪","🟧"],["⚫","⚪"],["🟫","🟩"]
    ]
  },
  fruit:{
    label:"水果",
    pairs:[
      ["🍎","🍏"],["🍓","🍒"],["🍊","🍋"],["🍉","🍈"],
      ["🍇","🫐"],["🍑","🍐"],["🥝","🥥"],["🍍","🍌"]
    ]
  },
  animal:{
    label:"動物",
    pairs:[
      ["🐶","🐱"],["🐰","🐹"],["🐸","🐢"],["🐟","🐠"],
      ["🐮","🐷"],["🦁","🐯"],["🐔","🦆"],["🐵","🦊"]
    ]
  },
  insect:{
    label:"昆蟲",
    pairs:[
      ["🐝","🦋"],["🐞","🪲"],["🐜","🐛"],["🦗","🪳"],
      ["🕷️","🦂"],["🪰","🦟"],["🐝","🐞"],["🦋","🐛"]
    ]
  }
};

const bottomGrid=document.querySelector("#bottomGrid");
const scoreEl=document.querySelector("#score");
const timeEl=document.querySelector("#time");
const correctEl=document.querySelector("#correct");
const statusEl=document.querySelector("#status");

let level="easy";
let topic="transport";
let playing=false;
let score=0;
let correct=0;
let time=60;
let timer;
let diffIndex=0;
let soundOn=true;
let audio;

function ctx(){
  if(!soundOn)return null;
  if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  return audio}

function tone(f,d=.1,delay=0,type="sine"){
  const a=ctx();
  if(!a)return;

  const o=a.createOscillator();
  const g=a.createGain();

  o.type=type;
  o.frequency.value=f;

  g.gain.setValueAtTime(.18,a.currentTime+delay);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+delay+d);

  o.connect(g);
  g.connect(a.destination);

  o.start(a.currentTime+delay);
  o.stop(a.currentTime+delay+d)}

function goodSound(){
  tone(540);
  tone(800,.12,.05)}

function badSound(){
  tone(260,.13,0,"square");
  tone(170,.18,.12,"square")}

function tickSound(){
  // 樂齡版：最後10秒節拍更大聲、更厚、更容易辨識
  tone(620,.14,0,"square");
  tone(310,.12,0,"sine");
  if(time<=3){
    tone(880,.16,.32,"square");
    tone(440,.14,.32,"sine");
  }}

function endSound(){
  tone(262);
  tone(330,.14,.14);
  tone(392,.14,.28);
  tone(523,.14,.42);
  tone(659,.35,.56)}

function newQuestion(){
  if(!playing)return;

  const size=cfg[level].size;
  const total=size*size;

  bottomGrid.innerHTML="";
  bottomGrid.style.gridTemplateColumns=`repeat(${size},1fr)`;
  bottomGrid.dataset.size=size;

  const pairSet=topics[topic].pairs;
  const pair=pairSet[Math.floor(Math.random()*pairSet.length)];
  const normal=pair[0];
  const odd=pair[1];

  diffIndex=Math.floor(Math.random()*total);

  for(let i=0;i<total;i++){
    const cell=document.createElement("button");
    cell.className="cell";
    cell.textContent=(i===diffIndex)?odd:normal;
    cell.dataset.index=i;
    cell.addEventListener("click",()=>choose(i,cell));
    bottomGrid.appendChild(cell)}
}

function choose(index,cell){
  if(!playing)return;

  if(index===diffIndex){
    score+=10;
    correct++;

    scoreEl.textContent=score;
    correctEl.textContent=correct;
    statusEl.textContent="⭕ 找到了！＋10";

    cell.classList.add("correct");
    goodSound();

    setTimeout(newQuestion,450)}else{
    badSound()}
}

function cheerSound(){
  const a=ctx();
  if(!a)return;
  const notes=[523,659,784,1046];
  notes.forEach((f,i)=>tone(f,.16,i*.12,"sine"));
  for(let i=0;i<14;i++){
    tone(700+Math.random()*700,.07,.58+i*.025,"square")}
}

function celebrate(){
  const c=document.querySelector("#confetti");
  c.innerHTML="";
  const colors=["#e65245","#f0b83f","#4f8a5b","#4f78b8","#a55db0","#ef7f2d"];
  const launchers=[
    {base:8, spread:1},
    {base:50, spread:0},
    {base:92, spread:-1}
  ];

  launchers.forEach((launcher,group)=>{
    for(let i=0;i<48;i++){
      const e=document.createElement("i");
      e.className="confettiPiece";
      e.style.left=(launcher.base+(Math.random()*8-4))+"%";
      e.style.background=colors[(i+group*2)%colors.length];

      let x;
      if(group===0){
        x=40+Math.random()*240;
      }else if(group===2){
        x=-40-Math.random()*240;
      }else{
        x=(Math.random()-.5)*300;
      }

      e.style.setProperty("--x",x+"px");
      e.style.setProperty("--y",(-320-Math.random()*360)+"px");
      e.style.animationDelay=(Math.random()*.38)+"s";
      e.style.animationDuration=(2.15+Math.random()*.7)+"s";
      c.appendChild(e);
      setTimeout(()=>e.remove(),3300);
    }
  });
}
function startGame(){
  document.querySelector("#finishOverlay").classList.remove("show");
  document.querySelector("#finishOverlay").setAttribute("aria-hidden","true");
  document.body.classList.remove("finished");

  const nameInput=document.querySelector("#name");
  const name=nameInput.value.trim() || "玩家";
  if(!nameInput.value.trim())nameInput.value="玩家";

  document.body.classList.add("playing");
  clearInterval(timer);

  score=0;
  correct=0;
  time=60;
  playing=true;

  scoreEl.textContent=0;
  correctEl.textContent=0;
  timeEl.textContent=60;
  timeEl.classList.remove("urgent");document.querySelector("#gridWrap").classList.remove("urgent");document.querySelector("#confetti").innerHTML="";

  statusEl.textContent=name+"，"+topics[topic].label+"主題開始！";

  newQuestion();

  // 遊戲開始時，只定位一次：將統計區＋遊戲盤整體置中。
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const stats=document.querySelector(".stats");
      const gridWrap=document.querySelector("#gridWrap");
      const statsRect=stats.getBoundingClientRect();
      const gridRect=gridWrap.getBoundingClientRect();
      const groupTop=window.scrollY+statsRect.top;
      const groupHeight=gridRect.bottom-statsRect.top;
      const target=groupTop-(window.innerHeight-groupHeight)/2;
      window.scrollTo({top:Math.max(0,target),behavior:"auto"});
    });
  });

  timer=setInterval(()=>{
    time--;
    timeEl.textContent=time;

    if(time<=10&&time>0){
      timeEl.classList.add("urgent");document.querySelector("#gridWrap").classList.add("urgent");
      statusEl.textContent="⏱️ 最後 "+time+" 秒";
      tickSound()}

    if(time<=0){
      finishGame(name)}
  },1000)}

function finishGame(name){
  document.body.classList.remove("playing");
  document.body.classList.add("finished");
  playing=false;
  clearInterval(timer);
  timeEl.classList.remove("urgent");document.querySelector("#gridWrap").classList.remove("urgent");

  statusEl.textContent="🎉 挑戰完成！答對 "+correct+" 題，"+score+" 分";
  endSound();cheerSound();celebrate();

  saveScore(name);

  document.querySelector("#finishScore").textContent=score;
  document.querySelector("#finishCorrect").textContent=correct;
  document.querySelector("#finishTopic").textContent=topics[topic].label;
  document.querySelector("#finishLevel").textContent=cfg[level].label;
  const overlay=document.querySelector("#finishOverlay");
  overlay.classList.add("show");
  overlay.setAttribute("aria-hidden","false");
}

function saveScore(name){
  let list=[];

  try{
    list=JSON.parse(localStorage.getItem("furuiThemeScores")||"[]")}catch(e){}

  list.push({
    name,
    level,
    topic,
    score,
    correct
  });

  list.sort((a,b)=>b.score-a.score);

  try{
    localStorage.setItem(
      "furuiThemeScores",
      JSON.stringify(list.slice(0,10))
    )}catch(e){}

  showRanking()}

function showRanking(){
  let list=[];

  try{
    list=JSON.parse(localStorage.getItem("furuiThemeScores")||"[]")}catch(e){}

  document.querySelector("#rank").innerHTML=
    list.length
    ?list.map(x=>`
      <tr>
<td>${String(x.name).replace(/[<>]/g,"")}</td>
<td>${topics[x.topic]?.label || "—"}</td>
<td>${cfg[x.level].label}</td>
<td><b>${x.score}</b></td>
<td>${x.correct}</td>
</tr>
    `).join("")
    :'<tr><td colspan="5">尚無成績</td></tr>'}

document.querySelectorAll(".level").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(playing)return;

    level=btn.dataset.level;

    document.querySelectorAll(".level")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    preview()})});

function preview(){
  const old=playing;
  playing=true;
  newQuestion();
  playing=old}

document.querySelectorAll(".topic").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(playing)return;
    topic=btn.dataset.topic;
    document.querySelectorAll(".topic").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    preview();
    statusEl.textContent="已選擇："+topics[topic].label})});

document.querySelector("#sound").addEventListener("click",()=>{
  soundOn=!soundOn;
  document.querySelector("#sound").textContent=soundOn?"🔊":"🔇"});

document.querySelector("#start").addEventListener("click",startGame);

document.querySelector("#playAgain").addEventListener("click",()=>startGame());

document.querySelector("#backSettings").addEventListener("click",()=>{
  const overlay=document.querySelector("#finishOverlay");
  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden","true");
  document.body.classList.remove("playing");
  document.body.classList.remove("finished");
  window.scrollTo({top:0,behavior:"auto"});
});


document.querySelector("#clearScores").addEventListener("click",()=>{
  if(confirm("確定要清除全部成績紀錄嗎？")){
    try{
      localStorage.removeItem("furuiThemeScores")}catch(e){}

    showRanking();
    statusEl.textContent="🗑️ 成績紀錄已清除"}
});


// 防止誤觸滑鼠右鍵跳出功能選單
document.addEventListener("contextmenu",e=>e.preventDefault());

// 遊戲進行中固定畫面，不讓頁面被滑動
document.addEventListener("wheel",e=>{
  if(playing)e.preventDefault();
},{passive:false});

document.addEventListener("touchmove",e=>{
  if(playing)e.preventDefault();
},{passive:false});

document.addEventListener("keydown",e=>{
  if(!playing)return;
  if(["ArrowUp","ArrowDown","PageUp","PageDown","Home","End"," "].includes(e.key)){
    e.preventDefault();
  }
});

document.body.classList.remove("finished");
preview();
showRanking();
</script>
</body>
</html>
